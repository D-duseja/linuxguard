name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name LinuxGuard --add-data "ui;ui" linuxguard.py
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: dist/LinuxGuard.exe }
  publish:
    needs: windows-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --prefix=linuxguard/ -o LinuxGuard-source.zip HEAD
      - uses: actions/download-artifact@v4
        with: { name: exe }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            LinuxGuard.exe
            LinuxGuard-source.zip
          generate_release_notes: true
